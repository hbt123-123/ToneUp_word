name: auto-release

# 模仿 ToneUp_read 的 daily-release：检测到源码变化后自动算下一版、签名构建、
# 生成 version.json 并发布 GitHub Release。区别是把触发方式改成 push（改代码即发布），
# 并保留手动触发入口。
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-release
  cancel-in-progress: false

env:
  # 参与“是否有代码变化”判断的路径；只改文档不会触发发布。
  SOURCE_PATHS: >-
    app/src
    app/build.gradle.kts
    app/proguard-rules.pro
    app/schemas
    build.gradle.kts
    settings.gradle.kts
    gradle.properties
    gradle/libs.versions.toml
    gradle/wrapper

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      TONEUP_KEYSTORE_PASSWORD: ${{ secrets.TONEUP_KEYSTORE_PASSWORD }}
      TONEUP_KEY_ALIAS: ${{ secrets.TONEUP_KEY_ALIAS }}
      TONEUP_KEY_PASSWORD: ${{ secrets.TONEUP_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # 需要完整历史与标签：上一版 tag 决定本次版本号。
          fetch-depth: 0

      - name: Check required secrets
        env:
          TONEUP_KEYSTORE_B64: ${{ secrets.TONEUP_KEYSTORE_B64 }}
        run: |
          missing=""
          for name in TONEUP_KEYSTORE_B64 TONEUP_KEYSTORE_PASSWORD TONEUP_KEY_ALIAS TONEUP_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::缺少仓库 Secrets:$missing"
            echo "请在 Settings → Secrets and variables → Actions 中补齐（见 docs/RELEASE_SIGNING.md）。"
            exit 1
          fi

      - name: Detect changes since last release
        id: detect
        run: |
          git fetch --tags --force
          LAST_TAG="$(git tag --list 'v*' --sort=-version:refname | head -n 1)"
          echo "last_tag=$LAST_TAG" >> "$GITHUB_OUTPUT"
          if [ -z "$LAST_TAG" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "还没有发布 tag，按首次发布处理。"
            exit 0
          fi
          # shellcheck disable=SC2086
          if git diff --quiet "$LAST_TAG"..HEAD -- $SOURCE_PATHS; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "自 $LAST_TAG 以来没有源码变化，跳过本次发布。"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "检测到 $LAST_TAG 之后的源码变化。"
          fi

      - name: Compute next version
        if: steps.detect.outputs.changed == 'true'
        id: version
        env:
          LAST_TAG: ${{ steps.detect.outputs.last_tag }}
        run: |
          CUR_NAME="$(sed -n -E 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)"
          CUR_CODE="$(sed -n -E 's/^[[:space:]]*versionCode = ([0-9]+).*/\1/p' app/build.gradle.kts | head -n 1)"
          if [ -z "$CUR_NAME" ] || [ -z "$CUR_CODE" ]; then
            echo "::error::无法从 app/build.gradle.kts 读取 versionName/versionCode"
            exit 1
          fi

          if [ -z "$LAST_TAG" ]; then
            LA=0; LB=0; LC=0; LAST_CODE=0
          else
            BASE="${LAST_TAG#v}"; BASE="${BASE%%+*}"
            LA="${BASE%%.*}"; REST="${BASE#*.}"
            LB="${REST%%.*}"; LC="${REST#*.}"
            [ "$LC" = "$REST" ] && LC=0
            LAST_CODE=$((10#$LA * 100 + 10#$LB * 10 + 10#$LC))
          fi

          # 手改过版本号（versionCode 比上一版 tag 大）就尊重手改，否则自动 patch+1。
          if [ "$CUR_CODE" -gt "$LAST_CODE" ]; then
            TARGET_NAME="$CUR_NAME"
            TARGET_CODE="$CUR_CODE"
          else
            MAJOR=$((10#$LA)); MINOR=$((10#$LB)); PATCH=$((10#$LC + 1))
            if [ "$PATCH" -ge 10 ]; then PATCH=0; MINOR=$((MINOR + 1)); fi
            if [ "$MINOR" -ge 10 ]; then MINOR=0; MAJOR=$((MAJOR + 1)); fi
            TARGET_NAME="$MAJOR.$MINOR.$PATCH"
            TARGET_CODE=$((MAJOR * 100 + MINOR * 10 + PATCH))
          fi

          IFS=. read -r MAJOR MINOR PATCH <<< "$TARGET_NAME"
          EXPECTED_CODE=$((10#$MAJOR * 100 + 10#$MINOR * 10 + 10#$PATCH))
          if [ "$TARGET_CODE" -ne "$EXPECTED_CODE" ]; then
            echo "::error::versionCode $TARGET_CODE != major*100+minor*10+patch ($EXPECTED_CODE)，与 UPDATE_PROTOCOL.md 不一致"
            exit 1
          fi
          if [ "$TARGET_CODE" -le "$LAST_CODE" ]; then
            echo "::error::计算出的 versionCode $TARGET_CODE 没有大于上一版 $LAST_CODE"
            exit 1
          fi

          TAG="v$TARGET_NAME"
          if [ -n "$(git tag --list "$TAG")" ]; then
            echo "::error::Tag $TAG 已存在；请先提高 versionName 再发布。"
            exit 1
          fi

          sed -i -E "s/^([[:space:]]*)versionCode = [0-9]+/\1versionCode = ${TARGET_CODE}/" app/build.gradle.kts
          sed -i -E "s/^([[:space:]]*)versionName = \"[^\"]+\"/\1versionName = \"${TARGET_NAME}\"/" app/build.gradle.kts
          grep -nE '^[[:space:]]*(versionCode|versionName) = ' app/build.gradle.kts

          echo "name=$TARGET_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$TARGET_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "本次目标版本：$TAG（versionCode $TARGET_CODE）"

      - name: Prepare release notes
        if: steps.detect.outputs.changed == 'true'
        env:
          LAST_TAG: ${{ steps.detect.outputs.last_tag }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # release-notes.md 被 .gitignore 忽略，CI 里不存在；从提交历史生成。
          # 本地若有带 "## vX.Y.Z" 标题的手写说明，也不会进仓库，故这里始终生成。
          RANGE="${LAST_TAG:+$LAST_TAG..}HEAD"
          {
            echo "## $TAG"
            echo
            # shellcheck disable=SC2086
            git log --no-merges --pretty=format:'- %s' "$RANGE" -- $SOURCE_PATHS \
              | grep -vE 'chore\(release\)' || true
          } > release-notes.md
          if [ "$(grep -c '^- ' release-notes.md || true)" -eq 0 ]; then
            {
              echo "## $TAG"
              echo
              echo "- 维护性更新，无用户可见变化"
            } > release-notes.md
          fi
          cat release-notes.md

      - name: Set up JDK 21
        if: steps.detect.outputs.changed == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        if: steps.detect.outputs.changed == 'true'
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::找不到 sdkmanager（SDK_ROOT=$SDK_ROOT）"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null
          echo "SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Set up Gradle
        if: steps.detect.outputs.changed == 'true'
        uses: gradle/actions/setup-gradle@v6

      - name: Configure signing
        if: steps.detect.outputs.changed == 'true'
        env:
          TONEUP_KEYSTORE_B64: ${{ secrets.TONEUP_KEYSTORE_B64 }}
        run: |
          KEYSTORE="$RUNNER_TEMP/toneup-release.jks"
          printf '%s' "$TONEUP_KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > "$KEYSTORE"
          test -s "$KEYSTORE"
          # 构建前先用 keytool 验证口令/别名，口令错时立刻失败，不用等 Gradle 跑完。
          keytool -list -keystore "$KEYSTORE" -storepass "$TONEUP_KEYSTORE_PASSWORD" -alias "$TONEUP_KEY_ALIAS" > /dev/null
          echo "TONEUP_KEYSTORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Make gradlew executable
        if: steps.detect.outputs.changed == 'true'
        run: chmod +x gradlew

      - name: Unit tests
        if: steps.detect.outputs.changed == 'true'
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build release APK
        if: steps.detect.outputs.changed == 'true'
        run: ./gradlew :app:assembleRelease -x lintVitalRelease --stacktrace

      - name: Verify APK signature and identity
        if: steps.detect.outputs.changed == 'true'
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.TONEUP_CERT_SHA256 }}
          EXPECTED_VERSION_NAME: ${{ steps.version.outputs.name }}
          EXPECTED_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          SDK="${SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$(ls -1 "$SDK"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n1)"
          AAPT="$(ls -1 "$SDK"/build-tools/*/aapt 2>/dev/null | sort -V | tail -n1)"
          if [ -z "$APKSIGNER" ] || [ -z "$AAPT" ]; then
            echo "::error::Android SDK 中找不到 apksigner / aapt（SDK=$SDK）"
            exit 1
          fi
          "$APKSIGNER" verify --verbose "$APK" || {
            echo "::error::APK 签名校验失败（可能未签名或签名损坏）"
            exit 1
          }
          if [ -n "$EXPECTED_CERT_SHA256" ]; then
            CERTS="$("$APKSIGNER" verify --print-certs "$APK")"
            ACTUAL_CERT="$(printf '%s\n' "$CERTS" | awk -F': ' '/certificate SHA-256 digest:/{print $NF; exit}' | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
            EXPECTED_CERT="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
            if [ "$ACTUAL_CERT" != "$EXPECTED_CERT" ]; then
              echo "::error::APK 签名证书不匹配：期望 $EXPECTED_CERT，实际 ${ACTUAL_CERT:-<未取到>}"
              printf '%s\n' "$CERTS"
              exit 1
            fi
            echo "签名证书校验通过：$ACTUAL_CERT"
          fi
          BADGING="$("$AAPT" dump badging "$APK" | head -n1)"
          PKG="$(printf '%s' "$BADGING" | sed -E "s/.*package: name='([^']+)'.*/\1/")"
          VC="$(printf '%s' "$BADGING" | sed -E "s/.*versionCode='([^']+)'.*/\1/")"
          VN="$(printf '%s' "$BADGING" | sed -E "s/.*versionName='([^']+)'.*/\1/")"
          if [ "$PKG" != "top.toneup.word" ] || [ "$VC" != "$EXPECTED_VERSION_CODE" ] || [ "$VN" != "$EXPECTED_VERSION_NAME" ]; then
            echo "::error::APK 标识不匹配：package=$PKG versionName=$VN versionCode=$VC，期望 top.toneup.word / $EXPECTED_VERSION_NAME / $EXPECTED_VERSION_CODE"
            exit 1
          fi
          echo "包标识校验通过：$PKG / $VN / versionCode $VC"

      - name: Generate release assets
        if: steps.detect.outputs.changed == 'true'
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          mkdir -p dist
          cp "$APK" dist/ToneUpWord.apk
          SHA="$(sha256sum dist/ToneUpWord.apk | awk '{print $1}')"
          SIZE="$(stat -c %s dist/ToneUpWord.apk)"
          jq -n \
            --arg version "${{ steps.version.outputs.name }}" \
            --argjson versionCode "${{ steps.version.outputs.code }}" \
            --arg url "https://github.com/hbt123-123/ToneUp_word/releases/latest/download/ToneUpWord.apk" \
            --arg sha256 "$SHA" \
            --argjson size "$SIZE" \
            --arg notes "$(cat release-notes.md)" \
            '{version:$version,versionCode:$versionCode,url:$url,sha256:$sha256,size:$size,notes:$notes}' \
            > dist/version.json
          cat dist/version.json

      - name: Commit version bump
        if: steps.detect.outputs.changed == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          if git diff --cached --quiet; then
            echo "版本号未变化，跳过提交。"
          else
            # [skip ci] 防止版本号提交再次触发本工作流。
            git commit -m "chore(release): $TAG [skip ci]"
            git push origin HEAD:main
          fi

      - name: Publish GitHub Release
        if: steps.detect.outputs.changed == 'true'
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            dist/ToneUpWord.apk dist/version.json \
            --target "$(git rev-parse HEAD)" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-file release-notes.md \
            --latest \
            --repo "${{ github.repository }}"

      - name: Verify fixed update URL
        if: steps.detect.outputs.changed == 'true'
        run: |
          for i in {1..6}; do
            if curl -fsSL "https://github.com/hbt123-123/ToneUp_word/releases/latest/download/version.json" \
              | jq -e --arg v "${{ steps.version.outputs.name }}" \
                  --argjson c "${{ steps.version.outputs.code }}" \
                  '.version == $v and .versionCode == $c' >/dev/null; then
              echo "固定更新链接校验通过：v${{ steps.version.outputs.name }}"
              exit 0
            fi
            sleep 10
          done
          echo "::error::releases/latest 未在预期时间内指向新版本"
          exit 1
